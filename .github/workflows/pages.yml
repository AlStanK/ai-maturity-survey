# Публікація анкети та сторінки аналітики на GitHub Pages.
# У Pages потрапляє лише статика (index.html, analytics.html + assets/) —
# схема БД, деплой-конфіги й Apps Script лишаються тільки в репо.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - analytics.html
      - assets/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Зібрати лише статику
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -f analytics.html ]; then cp analytics.html _site/; fi
          if [ -d assets ]; then cp -R assets _site/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
